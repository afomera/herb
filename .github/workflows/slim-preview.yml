name: Slim Preview

# Cut by `make prerelease` (script/slim-preview/release.sh), which pushes a
# `slim-preview-N` tag. The workflow runs from the tagged commit.

on:
  push:
    tags:
      - "slim-preview-*"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  prerelease:
    name: Build and publish ${{ github.ref_name }}
    runs-on: ubuntu-latest
    timeout-minutes: 30

    permissions:
      contents: write

    env:
      NX_NO_CLOUD: "true"
      TAG: ${{ github.ref_name }}

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version-file: ".node-version"
          cache: "yarn"

      - name: Add LLVM apt Repo
        run: |-
          wget -O - https://apt.llvm.org/llvm-snapshot.gpg.key | sudo apt-key add -
          sudo add-apt-repository "deb http://apt.llvm.org/$(lsb_release -cs)/ llvm-toolchain-$(lsb_release -cs)-21 main"
          sudo apt update

      - name: Install APT dependencies
        run: grep -v emscripten Aptfile | xargs sudo apt-get install -y --no-install-recommends

      - name: Setup Emscripten
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: 5.0.2
          actions-cache-folder: emsdk-cache-slim-preview

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - name: bundle install
        run: bundle install

      - name: Render Templates
        run: bundle exec rake templates

      - name: yarn install
        run: yarn install --frozen-lockfile

      - name: Build tailwind-class-sorter package
        run: yarn nx build @herb-tools/tailwind-class-sorter

      - name: Run `build` for all NX packages
        run: yarn build

      - name: Pack herb-slim-preview.tgz
        run: |
          core_version=$(jq -r '.version' javascript/packages/core/package.json)
          number=$(echo "${TAG#slim-preview-}" | tr -c '[:alnum:]\n' '-')

          PREVIEW_VERSION="$core_version-slim-preview.$number" \
          PREVIEW_SHA="$GITHUB_SHA" \
            script/slim-preview/pack.sh tmp/slim-preview

      - name: Smoke test herb-slim-preview.tgz
        run: script/slim-preview/smoke.sh tmp/slim-preview/herb-slim-preview.tgz

      - name: Package VS Code extension
        run: |
          cd javascript/packages/vscode
          npx @vscode/vsce package --no-dependencies --out herb-lsp.vsix
          cp herb-lsp.vsix "$GITHUB_WORKSPACE/tmp/slim-preview/herb-lsp.vsix"

      - name: Write checksums
        working-directory: tmp/slim-preview
        run: |
          sha256sum herb-slim-preview.tgz herb-lsp.vsix > SHA256SUMS
          cat SHA256SUMS

      - name: Write release notes
        run: script/slim-preview/release-notes.sh "$TAG" "$GITHUB_SHA" "$GITHUB_REPOSITORY" > tmp/slim-preview/NOTES.md

      - name: Create GitHub prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --prerelease \
            --title "$TAG" \
            --notes-file tmp/slim-preview/NOTES.md \
            tmp/slim-preview/herb-slim-preview.tgz \
            tmp/slim-preview/herb-lsp.vsix \
            tmp/slim-preview/SHA256SUMS
